<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blinky · a VCR to fiddle with</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
<meta name="description" content="A wordless, tactile VCR fidget toy. Set the blinking 12:00, spin the tape, tune the static.">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* A wordless VCR fidget toy. No goals, no text — just a machine to poke. */
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
:root{ --ink:#c9c2b4; --label:#8a8578; }
body{ background:radial-gradient(1100px 650px at 50% -8%,#17171c,#0a0a0c 62%); font-family:"Courier New",monospace;
  display:flex; align-items:center; justify-content:center; padding:22px 14px; min-height:100%; image-rendering:pixelated; }

#vcr{ width:min(620px,100%); position:relative;
  background:linear-gradient(180deg,#2f2f31,#19191b 42%,#101012); border-radius:12px; padding:18px 20px 20px; border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -8px 16px rgba(0,0,0,.6), 0 18px 40px rgba(0,0,0,.6); }
#vcr::before,#vcr::after{ content:""; position:absolute; top:8px; bottom:8px; width:12px; border-radius:5px;
  background:repeating-linear-gradient(96deg,#5c3c22 0 4px,#4a2f18 4px 7px,#6b4527 7px 12px); box-shadow:inset 0 0 6px rgba(0,0,0,.6); }
#vcr::before{left:-6px} #vcr::after{right:-6px}

#top{ display:flex; gap:14px; align-items:stretch; }
/* little CRT that shows transport state / snow */
#tv{ flex:0 0 168px; height:108px; border-radius:8px; overflow:hidden; position:relative;
  background:#05050a; box-shadow:inset 0 0 0 4px #121016, inset 0 0 34px #000; cursor:pointer; }
#tvGlow{ position:absolute; inset:0; opacity:0; transition:opacity .4s; }
#vcr.on #tvGlow{ opacity:1; background:radial-gradient(120% 130% at 50% 45%,#123 0%,#081135 60%,#05050a 100%); }
#snow{ position:absolute; inset:0; opacity:0; mix-blend-mode:screen; pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(200,200,200,.5) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 4px);
  background-size:100% 3px,5px 100%; animation:sn .1s steps(2) infinite; }
@keyframes sn{0%{background-position:0 0,0 0}100%{background-position:0 3px,4px 0}}
#bars{ position:absolute; inset:0; opacity:0; transition:opacity .25s;
  background:linear-gradient(90deg,#c8c8c8 0 14%,#c8c81f 14% 28%,#1fc8c8 28% 42%,#1fc81f 42% 57%,#c81fc8 57% 71%,#c81f1f 71% 85%,#1f1fc8 85% 100%); }
/* grainy "footage" while a tape plays */
#video{ position:absolute; inset:0; z-index:2; opacity:0; transition:opacity .2s; overflow:hidden;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px),
    conic-gradient(from 0deg at 42% 38%, #1f7a5a, #2a5aa0, #7a3aa0, #a06a2a, #2f8a3a, #1f7a5a);
  background-size:100% 4px, 320% 320%; filter:blur(1px) saturate(.75) brightness(.62);
  animation:vid 9s linear infinite; }
#video::before{ content:""; position:absolute; left:0; right:0; height:16px; background:rgba(255,255,255,.05); filter:blur(3px); animation:roll 5.5s linear infinite; }
#video.fast{ animation-duration:2.2s; filter:blur(1px) saturate(.6) brightness(.7) contrast(1.3); }
#video.fast::before{ animation-duration:.7s; }
#video.paused, #video.paused::before{ animation-play-state:paused; }
@keyframes vid{ 0%{background-position:0 0,0% 0%} 100%{background-position:0 0,100% 100%} }
@keyframes roll{ 0%{top:-16px} 100%{top:100%} }
#tv.warm{ animation:warm .5s ease; }
@keyframes warm{ 0%{filter:brightness(2.4) contrast(1.6)} 30%{filter:brightness(.7)} 60%{filter:brightness(1.3)} 100%{filter:none} }
#tvOSD{ position:absolute; left:10px; top:8px; z-index:3; font-size:26px; color:#8fffe9; text-shadow:0 0 8px rgba(77,255,217,.8);
  opacity:0; transition:opacity .15s; }
/* hidden snake game — the reward for stopping the blink */
#snake{ position:absolute; inset:0; z-index:3; width:100%; height:100%; opacity:0; pointer-events:none;
  image-rendering:pixelated; transition:opacity .25s; }
#snake.live{ opacity:1; }
/* curse veil — reception drops out over the frozen game while you deal with the clock */
#curseVeil{ position:absolute; inset:0; z-index:4; opacity:0; pointer-events:none;
  background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.08),rgba(2,2,12,.74)); transition:opacity .35s; }
#curseVeil.on{ opacity:1; animation:curseP 1.2s ease-in-out infinite; }
@keyframes curseP{ 0%,100%{filter:brightness(.9)} 50%{filter:brightness(1.6)} }
#tv::after{ content:""; position:absolute; inset:0; z-index:4; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px); mix-blend-mode:multiply; }

/* tape door + ejecting cassette */
#deck{ flex:1 1 auto; position:relative; height:108px; border-radius:6px;
  background:linear-gradient(180deg,#1a1a1a,#0d0d0d); box-shadow:inset 0 2px 8px rgba(0,0,0,.9); min-width:160px; }
#deck .slot{ position:absolute; left:12px; right:12px; top:14px; height:14px; border-radius:3px; background:linear-gradient(180deg,#000,#161616); box-shadow:inset 0 2px 5px #000; }
#deck .door{ position:absolute; left:12px; right:12px; top:36px; bottom:14px; border-radius:4px;
  background:repeating-linear-gradient(0deg,#141414 0 6px,#191919 6px 12px); box-shadow:inset 0 0 10px rgba(0,0,0,.8); }
#deck .logo{ position:absolute; right:14px; bottom:16px; font-size:11px; letter-spacing:2px; color:#8f8577; font-style:italic; font-weight:bold; z-index:1; }
#tape{ position:absolute; left:20px; right:20px; top:6px; height:92px; border-radius:5px; z-index:20;
  background:linear-gradient(180deg,#2a2a2e,#131316); border:1px solid #000; box-shadow:0 8px 18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12);
  transform:translateY(8px) scale(.94); opacity:0; pointer-events:none; transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s; cursor:pointer; }
#tape.out{ transform:translateY(-70px) scale(1); opacity:1; pointer-events:auto; }
#tape .spools{ position:absolute; left:16px; right:16px; top:14px; height:34px; display:flex; justify-content:space-between; align-items:center; padding:0 12px;
  background:linear-gradient(180deg,#3a3a40,#222); border-radius:4px; box-shadow:inset 0 0 8px #000; }
#tape .sp{ width:26px; height:26px; border-radius:50%; border:2px solid #111;
  background:radial-gradient(circle at 50% 50%,#ddd 0 4px,#555 4px 7px,#29292e 7px 10px,#4b3a2a 10px 13px); }
#tape.spin .sp{ animation:spin 1.1s linear infinite; }
@keyframes spin{to{transform:rotate(360deg)}}
#tape .lbl{ position:absolute; left:16px; right:16px; bottom:10px; height:34px; border-radius:2px; transform:rotate(-.8deg);
  background:linear-gradient(180deg,#f0e8d4,#e2d6b8); box-shadow:0 1px 3px rgba(0,0,0,.5); }
#tape .lbl::before{ content:""; position:absolute; inset:0 0 auto 0; height:6px; background:repeating-linear-gradient(90deg,#d84f4f 0 16px,#4f63d8 16px 32px); opacity:.7; }

/* VFD clock */
#disp{ flex:0 0 auto; align-self:center; border-radius:8px; padding:10px 14px; background:linear-gradient(180deg,#000,#080b0a);
  box-shadow:inset 0 0 14px #000; display:flex; flex-direction:column; align-items:center; gap:6px; }
#vfd{ display:flex; align-items:center; gap:6px; }
.dig{ position:relative; width:26px; height:46px; }
.seg{ position:absolute; background:#0a1310; border-radius:2px; opacity:.26; transition:opacity .06s; }
.seg.on{ background:#2a6a59; opacity:.55; }
.seg.a{left:3px;right:3px;top:0;height:4px}.seg.d{left:3px;right:3px;bottom:0;height:4px}.seg.g{left:3px;right:3px;top:21px;height:4px}
.seg.f{left:0;top:3px;width:4px;height:18px}.seg.b{right:0;top:3px;width:4px;height:18px}.seg.e{left:0;bottom:3px;width:4px;height:18px}.seg.c{right:0;bottom:3px;width:4px;height:18px}
#col{ display:flex; flex-direction:column; gap:10px; }
#col i{ width:5px;height:5px;border-radius:50%;background:#0a1310;opacity:.26 }
#col.on i{ background:#2a6a59; opacity:.55; }
#vfd.blink{ animation:bl 1.4s ease-in-out infinite; }
@keyframes bl{0%,40%{opacity:1}60%,100%{opacity:.34}}
/* the curse: the display warps like a chewed tape while the machine fights being set */
#vfd.haunted{ animation:bl 1s ease-in-out infinite, wob 2.1s ease-in-out infinite; }
@keyframes wob{ 0%,100%{transform:skewX(0) translateX(0)} 22%{transform:skewX(-2deg) translateX(-1px)} 55%{transform:skewX(1.4deg) translateX(1px)} 78%{transform:skewX(-.6deg) translateX(0)} }
#mer{ display:flex; flex-direction:column; gap:6px; margin-left:2px; }
#mer span{ font-size:10px; color:#0a1310; opacity:.5 }
#mer span.on{ color:#2a6a59; opacity:1 }
#recDot{ width:8px; height:8px; border-radius:50%; background:#3a0d0d; align-self:flex-start; margin-left:2px; }
#recDot.on{ background:#e0503f; box-shadow:0 0 6px #e0503f; }

/* buttons */
#rows{ display:flex; gap:16px; margin-top:16px; align-items:flex-start; flex-wrap:wrap; }
.grp{ display:flex; gap:7px; align-items:flex-end; }
.btn{ position:relative; min-width:52px; padding:11px 8px 10px; border-radius:5px; border:1px solid #000; cursor:pointer; text-align:center;
  background:linear-gradient(180deg,#343436,#202022 45%,#171719); box-shadow:0 4px 0 #050505,inset 0 1px 0 rgba(255,255,255,.14); }
.btn:active,.btn.dn{ transform:translateY(3px); box-shadow:0 1px 0 #050505,inset 0 1px 0 rgba(255,255,255,.08); }
.btn .g{ font-size:17px; color:#e6ddcd; }
#power .g{ color:#bdb4a6 }
#power .led{ position:absolute; top:4px; right:6px; width:6px;height:6px;border-radius:50%;background:#0d3a12 }
#vcr.on #power .led{ background:#4ce05a; box-shadow:0 0 6px #4ce05a }

/* dial */
#dialWrap{ display:flex; align-items:center; gap:7px; }
#dial{ width:54px;height:54px;border-radius:50%;cursor:grab;touch-action:none; position:relative; border:2px solid #000;
  background:conic-gradient(from 0deg,#3a3a3a,#191919 25%,#3a3a3a 50%,#191919 75%,#3a3a3a); box-shadow:0 3px 6px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2); }
#dial::before{ content:""; position:absolute; left:50%; top:4px; width:4px;height:15px;margin-left:-2px;border-radius:2px;background:#ddd; transform-origin:2px 25px; }
.step{ width:22px;height:22px;border-radius:4px;background:#1c1c1c;border:1px solid #000;color:var(--ink);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #050505 }
.step:active{ transform:translateY(1px); box-shadow:0 1px 0 #050505 }

.flap{ position:relative; }
.flapInner{ display:flex; gap:6px; padding:5px; border-radius:5px; background:#0d0d0d; box-shadow:inset 0 0 8px #000; }
.flapDoor{ position:absolute; inset:0; z-index:5; border-radius:5px; cursor:pointer; background:linear-gradient(180deg,#242426,#141416);
  border:1px solid #000; box-shadow:inset 0 1px 0 rgba(255,255,255,.1); transition:transform .4s,opacity .3s; transform-origin:bottom center; }
.flap.open .flapDoor{ transform:rotateX(80deg) translateY(6px); opacity:0; pointer-events:none; }
#brand{ margin-left:auto; align-self:center; text-align:right; }
#brand .b1{ font-size:14px; letter-spacing:2px; color:#bdb4a6; font-weight:bold }
#brand .b2{ font-size:9px; letter-spacing:1px; color:#7d7468; margin-top:3px }
#muteToggle{ position:fixed; right:12px; top:12px; background:#161617; color:var(--label); border:1px solid #333; border-radius:4px;
  font-size:16px; padding:3px 8px; cursor:pointer; }
</style>
</head>
<body>
<button id="muteToggle" title="sound">🔊</button>
<div id="vcr">
  <div id="top">
    <div id="tv">
      <div id="tvGlow"></div><div id="bars"></div><div id="video"></div><div id="snow"></div><canvas id="snake" width="160" height="100"></canvas><div id="curseVeil"></div><div id="tvOSD"></div>
    </div>
    <div id="disp">
      <div id="vfd" class="blink">
        <div class="dig" id="d0"></div><div class="dig" id="d1"></div>
        <div id="col" class="on"><i></i><i></i></div>
        <div class="dig" id="d2"></div><div class="dig" id="d3"></div>
        <div id="mer"><span id="am">AM</span><span id="pm">PM</span></div>
      </div>
      <div id="recDot"></div>
    </div>
    <div id="deck">
      <div id="tape" title="push in"><div class="spools"><div class="sp"></div><div class="sp"></div></div><div class="lbl"></div></div>
      <div class="slot"></div><div class="door"></div><div class="logo">βETA</div>
    </div>
  </div>

  <div id="rows">
    <div class="grp"><button class="btn" id="power" data-k="POWER"><span class="g">⏻</span><span class="led"></span></button></div>
    <div class="grp">
      <button class="btn" data-k="EJECT"><span class="g">⏏</span></button>
      <button class="btn" data-k="REW"><span class="g">◀◀</span></button>
      <button class="btn" data-k="PLAY"><span class="g">▶</span></button>
      <button class="btn" data-k="FF"><span class="g">▶▶</span></button>
      <button class="btn" data-k="STOP"><span class="g">■</span></button>
      <button class="btn" data-k="PAUSE"><span class="g">❙❙</span></button>
      <button class="btn" data-k="REC"><span class="g">●</span></button>
    </div>
    <div class="grp">
      <button class="btn" data-k="CHDN"><span class="g">▽</span></button>
      <button class="btn" data-k="CHUP"><span class="g">△</span></button>
    </div>
    <div class="flap" id="flap">
      <div class="flapInner">
        <button class="btn" data-k="CLOCK"><span class="g" style="font-size:11px">CLOCK</span></button>
        <button class="btn" data-k="HOUR"><span class="g" style="font-size:11px">HOUR</span></button>
        <button class="btn" data-k="MIN"><span class="g" style="font-size:11px">MIN</span></button>
      </div>
      <div class="flapDoor"></div>
    </div>
    <div id="dialWrap">
      <button class="step" data-t="-1">−</button><div id="dial"></div><button class="step" data-t="1">+</button>
    </div>
    <div id="brand"><div class="b1">blinky</div><div class="b2">VS-1200 · βETA HiFi</div></div>
  </div>
</div>

<script>
"use strict";
const el=id=>document.getElementById(id), $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,"0");

/* ---- soft audio ---- */
const A=(()=>{ let ctx,master,muted=false,whir,hn,hg;
  const en=()=>{ if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.14;master.connect(ctx.destination);} if(ctx.state==="suspended")ctx.resume(); return ctx; };
  const nb=s=>{const c=en(),b=c.createBuffer(1,c.sampleRate*s,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;};
  const env=(g,t,a,p,d)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);};
  const tone=(f,d,p,ty)=>{if(muted)return;const c=en(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.value=f;o.connect(g);g.connect(master);env(g,t,.005,p,d);o.start(t);o.stop(t+d+.02);};
  return {
    unlock:en, setMuted(m){muted=m;if(m){this.whirStop();this.hiss(0);}},
    hiss(v){ if(muted)v=0; const c=en(); if(v>0&&!hn){const s=c.createBufferSource();s.buffer=nb(1.2);s.loop=true;const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=1600;hg=c.createGain();hg.gain.value=0;s.connect(f);f.connect(hg);hg.connect(master);s.start();hn=s;} if(hg)hg.gain.linearRampToValueAtTime(v*.16,c.currentTime+.15); if(v===0&&hn){const n=hn;hn=null;hg=null;setTimeout(()=>{try{n.stop();}catch(e){}},300);} },
    clunk(){ if(muted)return; const c=en(),t=c.currentTime,s=c.createBufferSource();s.buffer=nb(.04);
      const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=1200;const g=c.createGain();s.connect(f);f.connect(g);g.connect(master);env(g,t,.002,.5,.05);s.start(t);tone(150,.05,.14,"sine"); },
    tick(){ tone(1400,.008,.05,"square"); },
    beep(){ tone(720,.02,.08,"square"); },
    nope(){ tone(130,.14,.12,"sine"); },
    levelup(){ tone(660,.05,.09,"sine"); setTimeout(()=>tone(990,.06,.09,"sine"),70); },   // wordless "notch" bloop
    curse(){ if(muted)return; const c=en(),t=c.currentTime,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();   // detuned dying-tape moan
      o.type="sine";o2.type="sine"; o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(88,t+.6);
      o2.frequency.setValueAtTime(331,t);o2.frequency.exponentialRampToValueAtTime(92,t+.6);   // beat against each other = wow/flutter
      o.connect(g);o2.connect(g);g.connect(master);env(g,t,.01,.5,.74);o.start(t);o2.start(t);o.stop(t+.76);o2.stop(t+.76); },
    tug(){ tone(150+Math.random()*60,.05,.10,"sine"); },   // the haunted yank back toward 12:00
    thunk(){ if(muted)return;const c=en(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(84,t);o.frequency.exponentialRampToValueAtTime(38,t+.16);o.connect(g);g.connect(master);env(g,t,.005,.6,.2);o.start(t);o.stop(t+.24); },
    whirStart(fast){ if(muted)return;const c=en();this.whirStop();const s=c.createBufferSource();s.buffer=nb(1);s.loop=true;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=fast?950:560;f.Q.value=1.4;const g=c.createGain();g.gain.value=.07;s.connect(f);f.connect(g);g.connect(master);s.start();whir={s};},
    whirStop(){ if(whir){try{whir.s.stop();}catch(e){}whir=null;} },
  };
})();

/* ---- seven-segment ---- */
const MAP={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgcde","7":"abc","8":"abcdefg","9":"abcfgd"};
const digs=[];
["d0","d1","d2","d3"].forEach(id=>{const h=el(id);const s={};"abcdefg".split("").forEach(k=>{const d=document.createElement("div");d.className="seg "+k;h.appendChild(d);s[k]=d;});digs.push(s);});
const setDig=(i,ch)=>{const lit=MAP[ch]||"";"abcdefg".split("").forEach(k=>digs[i][k].classList.toggle("on",lit.includes(k)));};

/* ---- state ---- */
const S={ on:false, min:0, set:false, setMode:false, ch:0, chan:"off", running:null, tv:22, unlocked:false, curseActive:false };
function render(){
  const m=((S.min%1440)+1440)%1440, h24=(m/60|0), mm=m%60, pm=h24>=12; let h=h24%12; if(h===0)h=12;
  const hs=String(h);
  setDig(0,hs.length>1?hs[0]:" "); setDig(1,hs[hs.length-1]); setDig(2,String(mm/10|0)); setDig(3,String(mm%10));
  el("am").classList.toggle("on",!pm); el("pm").classList.toggle("on",pm);
  el("vfd").classList.toggle("blink", !S.set && !S.setMode);   // nags until the correct time is set
  el("vfd").classList.toggle("haunted", S.curseActive && !S.setMode);   // warps while the curse is loose (calms while you carefully set)
  el("col").classList.toggle("on", true);
}
render();

/* clock runs once "set" */
function startClock(){ stopClock(); S.running=setInterval(()=>{ if(S.set){ S.min=(S.min+1)%1440; render(); } },60000); }
function stopClock(){ if(S.running){clearInterval(S.running);S.running=null;} }

/* ---- TV screen ---- */
// once you've stopped the blink, a secret snake channel appears at the end of the dial
function chans(){ return S.unlocked ? ["off","snow","bars","blue","snake"] : ["off","snow","bars","blue"]; }
function showChan(){
  const list=chans();
  const c=S.on?list[S.ch%list.length]:"off";
  const prev=S.chan; S.chan=c;
  const snowAmt = c==="snow" ? (.2+(100-S.tv)/100*.65) : 0;
  el("snow").style.opacity = String(snowAmt);
  el("bars").style.opacity = c==="bars"?"1":"0";
  el("tvGlow").style.opacity = S.on?"1":"0";
  A.hiss(S.on ? snowAmt : 0);   // tune the dial to hiss it away
  const cv=el("snake");
  if(c==="snake"){ cv.classList.add("live"); if(prev!=="snake" && !S.curseActive) snakeReset(); snakeEnsure(); }
  else { cv.classList.remove("live"); snakeStop(); }
}
function flashOSD(t){ const o=el("tvOSD"); if(!S.on){o.style.opacity="0";return;} o.textContent=t; o.style.opacity="1"; clearTimeout(o._t); o._t=setTimeout(()=>o.style.opacity="0",1100); }

/* ---- hidden snake game (the reward for stopping the blink) ---- */
const GW=16, GH=10, CELL=10;
const SNK={ body:[], dir:null, next:null, food:{x:8,y:5}, loop:null, dead:false, score:0, level:0, flash:0, paused:false };
const WALLS_AT=2;                       // levels 0–1 wrap forgivingly; the edges bite from here
const STEP_BASE=150, STEP_FLOOR=70;     // gentle tempo ramp, generously floored (never frantic)
const NOTCH=4;                          // acorns per level-up (raise for a gentler climb)
function snakeStepMs(){ return Math.max(STEP_FLOOR, STEP_BASE - SNK.level*10); }

/* ---- the curse: the clock is haunted, dragging itself back toward 12:00 ---- */
const CURSE_MIN=0;                                                  // 12:00 AM — the canonical blink
function driftMs(){ return Math.max(380, 1000 - SNK.level*110); }   // the pull comes faster each level
function driftMag(){ return 1 + SNK.level; }                        // ...and yanks harder each level
let driftTimer=null;
function stopDrift(){ if(driftTimer){ clearInterval(driftTimer); driftTimer=null; } }
function startDrift(){ stopDrift(); if(SNK.level<1) return;
  driftTimer=setInterval(()=>{ if(S.set||!S.curseActive){ stopDrift(); return; } tug12(); }, driftMs()); }
function tug12(){                                                   // haul the time toward the nearer 12:00 (0 or 720)
  const targets=[0,720]; let best=0,bd=1e9;
  targets.forEach(t=>{ let dd=Math.abs(S.min-t); dd=Math.min(dd,1440-dd); if(dd<bd){ bd=dd; best=t; } });
  if(bd===0) return;
  const fwd=(best-S.min+1440)%1440, step=(fwd<=720?1:-1)*Math.min(driftMag(),bd);
  S.min=((S.min+step)%1440+1440)%1440; A.tug(); render();
}
function curseReturn(){                                             // the eternal blink comes back, worse than before
  S.set=false; S.min=CURSE_MIN; S.curseActive=true; S.setMode=false;
  stopClock(); SNK.paused=true;
  if(S.on) el("curseVeil").classList.add("on");
  A.curse(); startDrift(); render();
}
function snakeRandFood(){ let f; do{ f={x:(Math.random()*GW)|0, y:(Math.random()*GH)|0}; }while(SNK.body.some(s=>s.x===f.x&&s.y===f.y)); return f; }
function snakeReset(){ SNK.body=[{x:8,y:5},{x:7,y:5},{x:6,y:5}]; SNK.dir=null; SNK.next=null; SNK.dead=false; SNK.paused=false; SNK.score=0; SNK.level=0; SNK.flash=0; SNK.food=snakeRandFood(); snakeDraw(); }
function snakeEnsure(){ if(!SNK.loop) snakeTick(); }
function snakeTick(){ snakeStep(); SNK.loop=setTimeout(snakeTick, snakeStepMs()); }   // tempo follows the level
function snakeStop(){ if(SNK.loop){ clearTimeout(SNK.loop); SNK.loop=null; } }
function snakeDir(dx,dy){
  if(SNK.paused) return;                                  // the curse has it — fix the clock first
  if(SNK.dead){ snakeReset(); A.tick(); return; }         // a nudge after death restarts
  if(SNK.dir && SNK.dir.x===-dx && SNK.dir.y===-dy) return; // no U-turns
  SNK.next={x:dx,y:dy}; if(!SNK.dir){ SNK.dir=SNK.next; }
}
function snakeStep(){
  if(SNK.dead || SNK.paused || !SNK.dir) return;            // frozen while the curse holds it; sits still until you steer
  SNK.dir=SNK.next||SNK.dir;
  const head={ x:SNK.body[0].x+SNK.dir.x, y:SNK.body[0].y+SNK.dir.y };
  const walls = SNK.level>=WALLS_AT;
  if(head.x<0||head.x>=GW||head.y<0||head.y>=GH){
    if(walls){ SNK.dead=true; A.thunk(); snakeDraw(); return; }   // deep in, the edges bite
    head.x=(head.x+GW)%GW; head.y=(head.y+GH)%GH;                 // early on, the screen wraps — forgiving
  }
  if(SNK.body.some(s=>s.x===head.x&&s.y===head.y)){ SNK.dead=true; A.thunk(); snakeDraw(); return; }
  SNK.body.unshift(head);
  if(head.x===SNK.food.x && head.y===SNK.food.y){
    SNK.score++; A.beep(); SNK.food=snakeRandFood();
    const nl=Math.floor(SNK.score/NOTCH);
    if(nl>SNK.level){ SNK.level=nl; SNK.flash=5; curseReturn(); }   // a notch = the curse returns: re-tune the clock (harder) to resume, then snake runs faster
  } else SNK.body.pop();
  if(SNK.flash>0) SNK.flash--;
  snakeDraw();
}
function snakeDraw(){
  const cx=el("snake").getContext("2d");
  cx.fillStyle="#05050a"; cx.fillRect(0,0,160,100);
  cx.fillStyle="#c9a83c"; cx.fillRect(SNK.food.x*CELL+2,SNK.food.y*CELL+2,6,6);   // acorn
  SNK.body.forEach((s,i)=>{ cx.fillStyle = i===0 ? "#8fffe9" : "#2a6a59"; cx.fillRect(s.x*CELL+1,s.y*CELL+1,8,8); });
  if(SNK.level>=WALLS_AT){ cx.strokeStyle=SNK.flash>0?"#8fffe9":"#2a6a59"; cx.lineWidth=2; cx.strokeRect(1,1,158,98); }  // the edges now bite
  cx.fillStyle="#2a6a59"; cx.font="9px monospace"; cx.textAlign="right"; cx.fillText(String(SNK.score),156,11);
  if(SNK.flash>0){ cx.fillStyle="rgba(143,255,233,.10)"; cx.fillRect(0,0,160,100); }   // soft "channel re-tuned" bloom
  if(SNK.dead){ cx.fillStyle="rgba(224,80,63,.22)"; cx.fillRect(0,0,160,100); }
}

/* ---- input ---- */
function press(k){
  A.unlock();
  if(k==="POWER"){ S.on=!S.on; el("vcr").classList.toggle("on",S.on); A.thunk(); showChan();
    if(S.on){ const tv=el("tv"); tv.classList.remove("warm"); void tv.offsetWidth; tv.classList.add("warm"); }
    else { flashOSD(""); A.whirStop(); A.hiss(0); el("tape").classList.remove("spin"); el("video").style.opacity="0"; }
    return; }
  A.clunk();
  if(k==="EJECT"){ const t=el("tape"); if(t.classList.contains("out")){t.classList.remove("out");A.whirStart(false);setTimeout(()=>A.whirStop(),400);} else {A.whirStart(false);setTimeout(()=>{A.whirStop();A.thunk();t.classList.add("out");},420);} t.classList.remove("spin"); return; }
  if(k==="CLOCK"){
    if(!S.setMode){ S.setMode=true; S.set=false; stopClock(); render(); return; }
    // confirming: a blinky only stops blinking when you set the CORRECT (real) time
    const now=new Date(), realMin=now.getHours()*60+now.getMinutes();
    let d=Math.abs(S.min-realMin); d=Math.min(d,1440-d);
    S.setMode=false;
    if(d<=1){ S.min=realMin; S.set=true; startClock(); A.beep(); stopDrift();
      if(S.curseActive){                               // you out-cranked the curse -> snake resumes, faster
        S.curseActive=false; SNK.paused=false; el("curseVeil").classList.remove("on"); flashOSD("◆");
      } else {                                         // the very first tune unlocks the hidden game
        S.unlocked=true;
        if(S.on){ S.ch=chans().indexOf("snake"); showChan(); flashOSD("◆"); }
      }
    } else { S.set=false; A.nope(); }                  // wrong time -> keeps blinking
    render(); return;
  }
  if(k==="HOUR"){ if(S.setMode){ S.min=(S.min+60)%1440; render(); } A.tick(); return; }
  if(k==="MIN"){ if(S.setMode){ S.min=(S.min+1)%1440; render(); } A.tick(); return; }
  if(k==="CHUP"||k==="CHDN"){ const n=chans().length; S.ch=(S.ch+(k==="CHUP"?1:-1)+n)%n; showChan(); A.beep(); flashOSD(chans()[S.ch]==="snake"?"◆":"CH"+(S.ch+1)); return; }
  // on the snake channel the transport buttons steer:  ◀◀ ▶▶ left/right, ▶ ■ up/down
  if(S.chan==="snake" && (k==="REW"||k==="FF"||k==="PLAY"||k==="STOP")){
    const dd={REW:[-1,0],FF:[1,0],PLAY:[0,-1],STOP:[0,1]}[k]; snakeDir(dd[0],dd[1]); A.tick(); return; }
  // transport
  const tape=el("tape"), vid=el("video");
  const roll=(fast)=>{ tape.classList.add("spin"); if(S.on){ vid.classList.remove("paused"); vid.classList.toggle("fast",!!fast); vid.style.opacity="1"; } };
  if(k==="PLAY"){ flashOSD("▶"); roll(false); A.whirStart(false); setTimeout(()=>A.whirStop(),700); }
  else if(k==="FF"){ flashOSD("▶▶"); roll(true); A.whirStart(true); setTimeout(()=>A.whirStop(),700); }
  else if(k==="REW"){ flashOSD("◀◀"); roll(true); A.whirStart(true); setTimeout(()=>A.whirStop(),700); }
  else if(k==="STOP"){ flashOSD("■"); tape.classList.remove("spin"); vid.style.opacity="0"; vid.classList.remove("paused"); A.whirStop(); el("recDot").classList.remove("on"); }
  else if(k==="PAUSE"){ flashOSD("❙❙"); tape.classList.remove("spin"); vid.classList.add("paused"); A.whirStop(); }
  else if(k==="REC"){ flashOSD("● REC"); roll(false); el("recDot").classList.add("on"); A.whirStart(false); setTimeout(()=>A.whirStop(),700); }
}

/* hold-repeat for HOUR/MIN */
function hold(btn,fn){ let a,b; const st=e=>{e.preventDefault();fn();a=setTimeout(()=>{b=setInterval(fn,90);},420);btn.classList.add("dn");};
  const sp=()=>{clearTimeout(a);clearInterval(b);btn.classList.remove("dn");};
  btn.addEventListener("pointerdown",st);["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,sp)); }
$$(".btn").forEach(b=>{ const k=b.dataset.k; if(k==="HOUR"||k==="MIN") hold(b,()=>press(k)); else b.addEventListener("click",()=>press(k)); });

el("tape").addEventListener("click",e=>{ e.stopPropagation(); el("tape").classList.remove("out"); A.whirStart(false); setTimeout(()=>{A.whirStop();A.thunk();},350); });
el("flap").querySelector(".flapDoor").addEventListener("click",()=>{ A.thunk(); el("flap").classList.add("open"); });
el("tv").addEventListener("click",()=>{ if(!S.on){press("POWER");} else if(S.chan!=="snake"){press("CHUP");} });
/* swipe on the screen to steer the snake (touch) */
(function(){ const tv=el("tv"); let sx=null,sy=null;
  tv.addEventListener("pointerdown",e=>{ sx=e.clientX; sy=e.clientY; });
  tv.addEventListener("pointerup",e=>{ if(S.chan!=="snake"||sx==null){sx=null;return;} const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>=12||Math.abs(dy)>=12){ if(Math.abs(dx)>Math.abs(dy)) snakeDir(dx>0?1:-1,0); else snakeDir(0,dy>0?1:-1); } sx=null; }); })();

/* tracking dial → snow */
(function(){ const d=el("dial"); let drag=false,ly=0;
  d.addEventListener("pointerdown",e=>{drag=true;ly=e.clientY;d.setPointerCapture(e.pointerId);A.unlock();});
  d.addEventListener("pointermove",e=>{ if(!drag)return; const dy=ly-e.clientY; ly=e.clientY; setTv(S.tv+dy*.5); });
  d.addEventListener("pointerup",()=>drag=false); d.addEventListener("pointercancel",()=>drag=false);
  $$(".step").forEach(b=>b.addEventListener("click",()=>{ setTv(S.tv+Number(b.dataset.t)*4); A.tick(); }));
  function setTv(v){ S.tv=Math.max(0,Math.min(100,v)); d.style.transform=`rotate(${S.tv*5.4}deg)`; showChan(); }
})();

el("muteToggle").addEventListener("click",()=>{ const m=el("muteToggle"); const on=m.textContent==="🔊"; A.setMuted(on); m.textContent=on?"🔇":"🔊"; });

/* keyboard, for the restless */
document.addEventListener("keydown",e=>{
  if(S.chan==="snake" && e.key.indexOf("Arrow")===0){ e.preventDefault();
    const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key]; if(d)snakeDir(d[0],d[1]); return; }
  const K={p:"POWER",e:"EJECT",c:"CLOCK",h:"HOUR",m:"MIN"," ":"PLAY",s:"STOP"}; const k=K[e.key.toLowerCase()]; if(k){e.preventDefault();press(k);}
  else if(e.key==="ArrowUp")press("CHUP"); else if(e.key==="ArrowDown")press("CHDN"); });
</script>
</body>
